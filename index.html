<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>我的知识助手</title>
<link rel="icon" href="data:,">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<style>
  body { margin: 0; font-family: "Microsoft YaHei", sans-serif; background: #111827; color: #e5e7eb; }
  .chat { max-width: 700px; margin: 0 auto; height: 100vh; display: flex; flex-direction: column; }
  .msgs { flex: 1; overflow-y: auto; padding: 20px; }
  .row { margin-bottom: 14px; display: flex; }
  .row.user { justify-content: flex-end; }
  .bubble { max-width: 80%; padding: 10px 14px; border-radius: 12px; white-space: pre-wrap; line-height: 1.6; }
  .user .bubble { background: #2563eb; color: #fff; border-bottom-right-radius: 4px; }
  .assistant .bubble { background: #1f2937; border-bottom-left-radius: 4px; }
  .input-bar { display: flex; padding: 14px; gap: 10px; border-top: 1px solid #374151; }
  input { flex: 1; padding: 10px 14px; border-radius: 8px; border: 1px solid #374151; background: #1f2937; color: #e5e7eb; font-size: 15px; }
  button { padding: 10px 22px; border-radius: 8px; border: none; background: #2563eb; color: #fff; font-size: 15px; cursor: pointer; }
  button:disabled { background: #4b5563; cursor: not-allowed; }
  .hint { text-align: center; color: #6b7280; font-size: 13px; padding: 8px; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
function App() {
  const [messages, setMessages] = React.useState([]);
  const [input, setInput] = React.useState("");
  const [loading, setLoading] = React.useState(false);

  async function send() {
    if (!input.trim() || loading) return;
    const q = input.trim();
    setInput("");
    setMessages(ms => [...ms, { role: "user", text: q }]);
    setLoading(true);
    try {
      const resp = await fetch("/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: q }),
      });
      const data = await resp.json();
      setMessages(ms => [...ms, { role: "assistant", text: data.reply }]);
    } catch (e) {
      setMessages(ms => [...ms, { role: "assistant", text: "请求失败：" + e.message }]);
    }
    setLoading(false);
  }

  const ref = React.useRef(null);
  React.useEffect(() => { ref.current && (ref.current.scrollTop = ref.current.scrollHeight); }, [messages]);

  return (
    <div className="chat">
      <div className="msgs" ref={ref}>
        {messages.length === 0 && <div className="hint">你好，我是你的个人知识助手。问点什么都行～</div>}
        {messages.map((m, i) => (
          <div key={i} className={"row " + m.role}>
            <div className="bubble">{m.text}</div>
          </div>
        ))}
        {loading && <div className="row assistant"><div className="bubble">思考中…</div></div>}
      </div>
      <div className="input-bar">
        <input
          value={input}
          onChange={e => setInput(e.target.value)}
          onKeyDown={e => e.key === "Enter" && send()}
          placeholder="输入你的问题，回车发送"
        />
        <button onClick={send} disabled={loading}>发送</button>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
